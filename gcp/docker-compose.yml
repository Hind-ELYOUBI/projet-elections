services:
  etcd:   # stockage de config de Patroni (qui est le leader)
    image: quay.io/coreos/etcd:v3.5.15
    network_mode: host
    restart: unless-stopped
    command: >
      etcd --name gcp --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://${GCP_IP}:2379
      --listen-peer-urls http://127.0.0.1:2380
      --initial-advertise-peer-urls http://127.0.0.1:2380
      --initial-cluster gcp=http://127.0.0.1:2380
    volumes: [etcd-data:/etcd-data]

  mirrormaker:
    image: apache/kafka:3.8.0
    network_mode: host
    restart: unless-stopped
    command: /opt/kafka/bin/connect-mirror-maker.sh /mm2/mm2.properties
    volumes: [./mm2.properties:/mm2/mm2.properties:ro]

  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    restart: unless-stopped
    volumes: [./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]

  grafana:
    image: grafana/grafana:11.3.0
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes: [./grafana:/etc/grafana/provisioning/datasources:ro]

  controller:
    build: ./controller
    network_mode: host
    restart: unless-stopped
    env_file: .env

volumes:
  etcd-data:
